<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="420">
    <stop offset="0" stop-color="#050508"/>
    <stop offset="0.45" stop-color="#090612"/>
    <stop offset="1" stop-color="#03060C"/>
  </linearGradient>

  <linearGradient id="line" x1="200" y1="0" x2="1400" y2="420">
    <stop stop-color="#7C3AED" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#C084FC"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="text" x1="520" y1="160" x2="1080" y2="270">
    <stop stop-color="#FFFFFF"/>
    <stop offset="0.48" stop-color="#E9D5FF"/>
    <stop offset="1" stop-color="#A5F3FC"/>
  </linearGradient>

  <radialGradient id="glowPurple">
    <stop stop-color="#8B5CF6" stop-opacity="0.32"/>
    <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="glowCyan">
    <stop stop-color="#22D3EE" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="35"/>
  </filter>

  <filter id="textGlow">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M50 0H0V50" stroke="#FFFFFF" stroke-opacity="0.035"/>
  </pattern>

  <style>
    .orb1 {
      animation: float1 9s ease-in-out infinite alternate;
    }

    .orb2 {
      animation: float2 11s ease-in-out infinite alternate;
    }

    .orb3 {
      animation: float3 13s ease-in-out infinite alternate;
    }

    .scan {
      animation: scan 6s linear infinite;
    }

    .pulse {
      animation: pulse 4s ease-in-out infinite;
    }

    .shine {
      animation: shine 5s ease-in-out infinite;
    }

    @keyframes float1 {
      from { transform: translate(0,0); }
      to   { transform: translate(130px,45px); }
    }

    @keyframes float2 {
      from { transform: translate(0,0); }
      to   { transform: translate(-110px,35px); }
    }

    @keyframes float3 {
      from { transform: translate(0,0); }
      to   { transform: translate(70px,-55px); }
    }

    @keyframes scan {
      from { transform: translateX(-500px); opacity: 0; }
      15%  { opacity: 0.8; }
      50%  { opacity: 0.2; }
      85%  { opacity: 0.8; }
      to   { transform: translateX(1900px); opacity: 0; }
    }

    @keyframes pulse {
      0%,100% { opacity: 0.45; }
      50%      { opacity: 1; }
    }

    @keyframes shine {
      0%,100% { opacity: 0; transform: translateX(-120px); }
      35%     { opacity: 0.8; }
      65%     { opacity: 0; transform: translateX(120px); }
    }
  </style>

</defs>

<!-- Background -->

<rect width="1600" height="420" rx="24" fill="url(#bg)"/>
<rect width="1600" height="420" rx="24" fill="url(#grid)"/>

<!-- Ambient glows -->

<g class="orb1">
  <circle cx="290" cy="120" r="300" fill="url(#glowPurple)" filter="url(#blur)"/>
</g>

<g class="orb2">
  <circle cx="1320" cy="315" r="280" fill="url(#glowCyan)" filter="url(#blur)"/>
</g>

<g class="orb3">
  <circle cx="820" cy="420" r="220" fill="url(#glowPurple)" filter="url(#blur)"/>
</g>

<!-- Decorative lines -->

<path
d="M-100 345C260 165 390 440 730 285C1040 145 1190 265 1700 75"
stroke="url(#line)"
stroke-width="1.5"
opacity="0.65"
/>

<path
d="M-100 375C270 195 430 465 760 310C1080 160 1230 295 1700 105"
stroke="url(#line)"
stroke-width="1"
opacity="0.25"
/>

<!-- Animated scan -->

<rect
class="scan"
x="-500"
y="0"
width="340"
height="420"
fill="url(#line)"
opacity="0.18"
transform="skewX(-12)"
/>

<!-- Side accents -->

<g class="pulse">
  <circle cx="120" cy="210" r="3" fill="#A78BFA"/>
  <circle cx="1480" cy="210" r="3" fill="#67E8F9"/>
</g>

<g opacity="0.3">
  <circle cx="120" cy="210" r="14" stroke="#8B5CF6"/>
  <circle cx="1480" cy="210" r="14" stroke="#22D3EE"/>
</g>

<!-- Name glow -->

<text
x="800"
y="218"
text-anchor="middle"
font-family="Inter, Arial, sans-serif"
font-size="76"
font-weight="700"
letter-spacing="8"
fill="#A855F7"
opacity="0.35"
filter="url(#textGlow)"

>

ARVIN JAFARI </text>

<!-- Name -->

<text
x="800"
y="218"
text-anchor="middle"
font-family="Inter, Arial, sans-serif"
font-size="76"
font-weight="700"
letter-spacing="8"
fill="url(#text)"

>

ARVIN JAFARI </text>

<!-- Animated shine -->

<text
class="shine"
x="800"
y="218"
text-anchor="middle"
font-family="Inter, Arial, sans-serif"
font-size="76"
font-weight="700"
letter-spacing="8"
fill="#FFFFFF"
opacity="0"

>

ARVIN JAFARI </text>

<!-- Bottom detail -->

<path
d="M620 282H980"
stroke="url(#line)"
stroke-width="1"
/>

</svg>
